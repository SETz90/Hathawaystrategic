<span class="auth-eyebrow">Client Access</span>
<h1>Reset Your Password</h1>
<p class="auth-sub">
  Enter your email and we'll send you a link to reset your password.
</p>

<div class="auth-error-banner" id="authError"></div>
<div
  class="auth-error-banner"
  id="authSuccess"
  style="
    color: #8fe0a1;
    background: rgba(143, 224, 161, 0.08);
    border-color: rgba(143, 224, 161, 0.3);
  "
></div>

<form id="forgotForm" novalidate>
  <div class="auth-field">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required autocomplete="email" />
  </div>
  <button type="submit" class="btn-primary auth-submit" id="forgotSubmit">
    Send Reset Link
  </button>
</form>

<div class="auth-footer-links" style="justify-content: center">
  <a href="login.html">Back to log in</a>
</div>

<script type="module">
  import { forgotPassword } from "./auth-client.js";

  const form = document.getElementById("forgotForm");
  const errorBanner = document.getElementById("authError");
  const successBanner = document.getElementById("authSuccess");
  const submitBtn = document.getElementById("forgotSubmit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBanner.classList.remove("is-visible");
    successBanner.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    try {
      const email = document.getElementById("email").value.trim();
      await forgotPassword(email);
      successBanner.textContent =
        "If that email exists, a reset link is on its way.";
      successBanner.classList.add("is-visible");
      form.reset();
    } catch (err) {
      errorBanner.textContent = err.message;
      errorBanner.classList.add("is-visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";
    }
  });
</script>

<script src="auth-client.js" type="module"></script>
<script src="main.js?v=1784946336"></script>
